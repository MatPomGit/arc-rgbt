name: Offline unit and integration checks
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline:
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Offline checks (preinstalled dependencies)
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH="$PWD/src"
          python3 -m pytest -q
          python3 -m ruff check src tests tools
          python3 -m arc_rgbt.e00 --config experiments/E00/config.yaml --output "$RUNNER_TEMP/arc-rgbt-e00-${{ github.run_id }}"
          python3 -m arc_rgbt.e01 --dataset datasets/manifests/e01-synthetic-quality.json --output "$RUNNER_TEMP/arc-rgbt-e01-${{ github.run_id }}"
          python3 -m arc_rgbt.e02 --config experiments/E02/config.json --output "$RUNNER_TEMP/arc-rgbt-e02-${{ github.run_id }}"
