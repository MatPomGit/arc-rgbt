name: MkDocs strict documentation validation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  documentation:
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Validate navigation and source-backed contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 -m tools.check_docs
          python3 -m pytest -q tests/test_docs.py
      - name: Strict static site build (preinstalled dependencies)
        shell: bash
        run: |
          set -euo pipefail
          python3 -m mkdocs build --strict --clean --site-dir "$RUNNER_TEMP/arc-rgbt-site"
