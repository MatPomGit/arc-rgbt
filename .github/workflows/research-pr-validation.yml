name: PR publication portfolio and MkDocs checks

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "publications/**"
      - "research/**"
      - "docs/**"
      - "tests/test_project_state.py"
      - "tests/test_docs.py"
      - "tools/check_docs.py"
      - "PROJECT_STATE.yaml"
      - "RESEARCH.md"
      - "AUTOPILOT_PLAN.md"
      - "ROADMAP.md"
      - "README.md"
      - "AGENTS.md"
      - "pyproject.toml"
      - "mkdocs.yml"
      - ".github/workflows/research-pr-validation.yml"

permissions:
  contents: read

concurrency:
  group: rgbt-research-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  isolated-validation:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact proposed source revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Select Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - name: Install free documentation dependencies
        run: |
          python -m pip install "PyYAML>=6,<7" "mkdocs>=1.6,<2" "mkdocs-material>=9.6,<10" "pytest>=8,<10"
      - name: Verify exact PR head and publications state
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          python -m pytest -q tests/test_project_state.py tests/test_docs.py
      - name: Verify MkDocs navigation and build
        run: |
          python -m tools.check_docs
          python -m mkdocs build --strict --clean --site-dir "$RUNNER_TEMP/arc-rgbt-docs"
