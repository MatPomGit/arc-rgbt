name: Publish MkDocs to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "pyproject.toml"
      - "tools/check_docs.py"
      - "tests/test_docs.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out trusted main
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Select Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'

      - name: Install free documentation dependencies
        run: |
          python -m pip install "mkdocs>=1.6,<2" "mkdocs-material>=9.6,<10" "pytest>=8,<10"

      - name: Verify documentation and links
        run: |
          python -m tools.check_docs
          python -m pytest -q tests/test_docs.py tests/test_project_state.py

      - name: Build complete static site
        run: python -m mkdocs build --strict --clean --site-dir site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: site/

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Deploy Pages artifact
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

  smoke:
    name: Verify public Pages URLs
    if: github.ref == 'refs/heads/main'
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
    steps:
      - name: Check published pages and search index
        shell: bash
        env:
          SITE_ROOT: https://matpomgit.github.io/arc-rgbt
        run: |
          set -euo pipefail
          temp_dir="$(mktemp -d)"
          trap 'rm -rf "$temp_dir"' EXIT
          paths=(
            "/"
            "/getting-started/"
            "/experiments/e00/"
            "/experiments/e01/"
            "/experiments/e02/"
            "/experiments/literature-screening/"
            "/guides/evaluation-requirements/"
            "/reference/cli/"
            "/search/search_index.json"
          )
          for i in "${!paths[@]}"; do
            path="${paths[$i]}"
            url="${SITE_ROOT}${path}"
            output="${temp_dir}/page-${i}"
            curl --fail --location --silent --show-error \
              --retry 6 --retry-all-errors --retry-delay 3 \
              --connect-timeout 10 --max-time 25 \
              --output "$output" "$url"
            test -s "$output"
            if [[ "$path" == "/" ]]; then
              grep -qi 'arc-rgbt' "$output"
            fi
            if [[ "$path" == "/search/search_index.json" ]]; then
              grep -q '"docs"' "$output"
            fi
            echo "PAGE_OK $path"
          done
          echo "PAGES_SMOKE=PASS paths=${#paths[@]}"
